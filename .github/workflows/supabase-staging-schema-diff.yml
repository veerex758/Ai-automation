name: Supabase staging schema diff

on:
  push:
    branches:
      - staging/aivanta-supabase-rebuild
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-staging-schema-diff
  cancel-in-progress: false

jobs:
  compare:
    name: Compare tracked migrations with isolated staging schema
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: aivanta-staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ygclofqxtztnynkljipj
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.120.0

      - name: Verify staging-only credentials are available
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Missing SUPABASE_ACCESS_TOKEN secret in the aivanta-staging GitHub environment"; exit 2; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo "Missing SUPABASE_DB_PASSWORD secret in the aivanta-staging GitHub environment"; exit 2; }
          test "$SUPABASE_PROJECT_REF" = "ygclofqxtztnynkljipj" || { echo "Refusing unexpected project"; exit 2; }
          supabase --version

      - name: Link only the dedicated staging project
        shell: bash
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Record local/remote migration history comparison
        shell: bash
        run: supabase migration list

      - name: Diff remote public/private schema against tracked migration replay
        id: schema_diff
        shell: bash
        run: |
          set -euo pipefail
          : > staging-schema-diff.log
          set +e
          supabase db diff --linked --schema public,private > staging-schema-diff.log 2>&1
          status=$?
          set -e
          if grep -qi "No schema changes found" staging-schema-diff.log; then
            : > staging-schema-diff.sql
            echo "has_diff=false" >> "$GITHUB_OUTPUT"
            echo "No public/private schema diff reported."
          elif [ "$status" -ne 0 ]; then
            echo "Schema diff command failed; inspect the uploaded diagnostic log."
            exit "$status"
          else
            cp staging-schema-diff.log staging-schema-diff.sql
            echo "has_diff=true" >> "$GITHUB_OUTPUT"
            echo "Schema differences detected. They must be reviewed before any migration-history repair."
          fi

      - name: Upload schema diff evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aivanta-staging-schema-diff
          path: |
            staging-schema-diff.log
            staging-schema-diff.sql
          if-no-files-found: warn
          retention-days: 3

      - name: Fail closed when schema differences need review
        if: steps.schema_diff.outputs.has_diff == 'true'
        shell: bash
        run: |
          echo "Staging schema differs from the tracked migration replay. Do not repair migration history until the artifact is reviewed."
          exit 1
