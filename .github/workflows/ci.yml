name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aivanta_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aivanta_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/aivanta_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Workflow validation tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Build
        run: npm run build

  authenticated-e2e:
    name: Authenticated preview E2E
    runs-on: ubuntu-latest
    needs: verify
    if: ${{ vars.AIVANTA_E2E_BASE_URL != '' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Require dedicated staging credentials
        env:
          AIVANTA_E2E_BASE_URL: ${{ vars.AIVANTA_E2E_BASE_URL }}
          AIVANTA_E2E_EMAIL: ${{ secrets.AIVANTA_E2E_EMAIL }}
          AIVANTA_E2E_PASSWORD: ${{ secrets.AIVANTA_E2E_PASSWORD }}
        run: |
          test -n "$AIVANTA_E2E_BASE_URL" || { echo "Missing AIVANTA_E2E_BASE_URL repository variable"; exit 1; }
          test -n "$AIVANTA_E2E_EMAIL" || { echo "Missing AIVANTA_E2E_EMAIL repository secret"; exit 1; }
          test -n "$AIVANTA_E2E_PASSWORD" || { echo "Missing AIVANTA_E2E_PASSWORD repository secret"; exit 1; }
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run authenticated workflow lifecycle
        env:
          AIVANTA_E2E_BASE_URL: ${{ vars.AIVANTA_E2E_BASE_URL }}
          AIVANTA_E2E_EMAIL: ${{ secrets.AIVANTA_E2E_EMAIL }}
          AIVANTA_E2E_PASSWORD: ${{ secrets.AIVANTA_E2E_PASSWORD }}
        run: npm run test:e2e
