name: Supabase migration replay

on:
  push:
    branches:
      - aivanta/reconcile-staging-migration-history
    paths:
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
      - '.github/workflows/migration-replay.yml'
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
      - '.github/workflows/migration-replay.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out migration inventory
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.84.2

      - name: Initialize disposable local Supabase project
        run: |
          if [ ! -f supabase/config.toml ]; then
            supabase init
          fi

      - name: Select free local Postgres ports
        shell: bash
        run: |
          set -euo pipefail
          # Hosted runners may already have common Supabase ports in use. Ask
          # the OS for two currently free TCP ports instead of selecting fixed
          # ports which can collide with unrelated runner services.
          read -r db_port shadow_port < <(python3 - <<'PY'
          import socket

          ports = []
          while len(ports) < 2:
              with socket.socket(socket.AF_INET, socket.SOCK_STREAM) as sock:
                  sock.bind(("0.0.0.0", 0))
                  port = sock.getsockname()[1]
              if port not in ports:
                  ports.append(port)
          print(*ports)
          PY
          )
          export DB_PORT="$db_port" SHADOW_PORT="$shadow_port"
          python3 - <<'PY'
          import os
          import pathlib
          import re

          config = pathlib.Path("supabase/config.toml")
          source = config.read_text()
          match = re.search(r"(?ms)(^\\[db\\]\\s*\\n)(.*?)(?=^\\[|\\Z)", source)
          if not match:
              raise SystemExit("Could not find [db] section in Supabase config")
          block = match.group(2)
          block, db_count = re.subn(r"(?m)^port\\s*=\\s*\\d+\\s*$", f"port = {os.environ['DB_PORT']}", block, count=1)
          block, shadow_count = re.subn(r"(?m)^shadow_port\\s*=\\s*\\d+\\s*$", f"shadow_port = {os.environ['SHADOW_PORT']}", block, count=1)
          if db_count != 1 or shadow_count != 1:
              raise SystemExit("Could not update the [db] and [db].shadow_port settings")
          config.write_text(source[:match.start(2)] + block + source[match.end(2):])
          print(f"Selected Supabase db port {os.environ['DB_PORT']} and shadow port {os.environ['SHADOW_PORT']}")
          PY
          grep -A12 '^\\[db\\]' supabase/config.toml

      - name: Start local Postgres
        run: supabase db start

      - name: Replay all migrations from a clean local database
        run: supabase db reset --local --no-seed

      - name: Run database transaction tests (pgTAP)
        run: supabase test db --local

      - name: Verify local migration inventory
        shell: bash
        run: |
          set -euo pipefail
          count="$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | wc -l | tr -d ' ')"
          echo "Migration files discovered: $count"
          supabase migration list --local

      - name: Stop disposable local Supabase project
        if: always()
        run: supabase stop --no-backup
