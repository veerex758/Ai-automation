name: Supabase migration replay

on:
  push:
    branches:
      - aivanta/reconcile-staging-migration-history
    paths:
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
      - '.github/workflows/migration-replay.yml'
  # Run the full migration replay on every PR so schema compatibility is
  # verified even when the PR changes only application code.
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out migration inventory
        uses: actions/checkout@v4

      - name: Set up Node.js for the concurrent RPC regression
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.84.2

      - name: Initialize disposable local Supabase project
        run: |
          if [ ! -f supabase/config.toml ]; then
            supabase init
          fi

      - name: Start local Postgres
        run: supabase db start

      - name: Replay all migrations from a clean local database
        run: supabase db reset --local --no-seed

      - name: Run database transaction tests (pgTAP)
        run: supabase test db --local

      - name: Export local Supabase API credentials
        shell: bash
        run: |
          set -euo pipefail
          eval "$(supabase status --output env | sed -n 's/^API_URL=/export API_URL=/p; s/^SERVICE_ROLE_KEY=/export SERVICE_ROLE_KEY=/p')"
          test -n "${API_URL:-}"
          test -n "${SERVICE_ROLE_KEY:-}"
          echo "API_URL=${API_URL}" >> "$GITHUB_ENV"
          echo "SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}" >> "$GITHUB_ENV"

      - name: Exercise concurrent webhook claims against local Postgres
        run: node --test tests/billing-webhook-claims.integration.test.mjs

      - name: Verify local migration inventory
        shell: bash
        run: |
          set -euo pipefail
          count="$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | wc -l | tr -d ' ')"
          echo "Migration files discovered: $count"
          supabase migration list --local

      - name: Stop disposable local Supabase project
        if: always()
        run: supabase stop --no-backup
