name: Supabase migration replay

on:
  push:
    branches:
      - aivanta/reconcile-staging-migration-history
    paths:
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
      - '.github/workflows/migration-replay.yml'
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
      - '.github/workflows/migration-replay.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out migration inventory
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.84.2

      - name: Initialize disposable local Supabase project
        run: |
          if [ ! -f supabase/config.toml ]; then
            supabase init
          fi

      - name: Start local Postgres
        run: supabase db start

      - name: Replay all migrations from a clean local database
        run: supabase db reset --local --no-seed

      - name: Verify local migration inventory
        shell: bash
        run: |
          set -euo pipefail
          count="$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | wc -l | tr -d ' ')"
          echo "Migration files discovered: $count"
          supabase migration list --local

      - name: Stop disposable local Supabase project
        if: always()
        run: supabase stop --no-backup
