name: Aivanta staging runtime smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aivanta-staging-runtime-smoke
  cancel-in-progress: false

jobs:
  staging-smoke:
    name: Protected preview endpoint contracts
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: staging
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Diagnose runner DNS and fetch dispatch safely
        env:
          AIVANTA_STAGING_URL: https://ai-automation-52awb5lpz-veerex-org.vercel.app
        run: |
          node --input-type=module <<'NODE'
          import dns from "node:dns/promises";

          const target = new URL(process.env.AIVANTA_STAGING_URL);
          console.log(`Node runtime: ${process.version}`);
          console.log(`Staging origin configured: ${target.origin}`);
          console.log(`NODE_OPTIONS present: ${Boolean(process.env.NODE_OPTIONS)}`);
          console.log(`NODE_USE_ENV_PROXY enabled: ${/^(1|true|yes)$/i.test(process.env.NODE_USE_ENV_PROXY || "")}`);
          console.log(`npm proxy config present: ${Boolean(process.env.npm_config_proxy || process.env.npm_config_https_proxy)}`);

          for (const [label, hostname] of [["staging", target.hostname], ["literal-api-diagnostic", "api"]]) {
            try {
              const records = await dns.lookup(hostname, { all: true });
              console.log(`DNS ${label}: resolved (${records.length} address record(s))`);
            } catch (error) {
              console.log(`DNS ${label}: ${error.code || error.name}`);
            }
          }

          for (const key of ["HTTPS_PROXY", "https_proxy", "HTTP_PROXY", "http_proxy", "ALL_PROXY", "all_proxy"]) {
            const value = process.env[key];
            if (!value) {
              console.log(`Proxy ${key}: absent`);
              continue;
            }
            try {
              const proxy = new URL(value);
              console.log(`Proxy ${key}: configured host=${proxy.hostname} port=${proxy.port || "(default)"}`);
              try {
                await dns.lookup(proxy.hostname);
                console.log(`DNS proxy host for ${key}: resolved`);
              } catch (error) {
                console.log(`DNS proxy host for ${key}: ${error.code || error.name}`);
              }
            } catch {
              console.log(`Proxy ${key}: configured but not parseable as a URL (value hidden)`);
            }
          }
          NODE
      - name: Run staging-only unauthenticated smoke checks
        env:
          AIVANTA_STAGING_URL: https://ai-automation-52awb5lpz-veerex-org.vercel.app
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node scripts/staging-smoke.mjs
