name: Aivanta staging runtime smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aivanta-staging-runtime-smoke
  cancel-in-progress: false

jobs:
  staging-smoke:
    name: Protected preview endpoint contracts
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: staging
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Diagnose runner DNS and fetch environment safely
        env:
          AIVANTA_STAGING_URL: https://ai-automation-git-fix-staging-smoke-preview-target-veerex-org.vercel.app
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          node --input-type=module <<'NODE'
          import dns from "node:dns/promises";

          const target = new URL(process.env.AIVANTA_STAGING_URL);
          console.log("Node runtime: " + process.version);
          console.log("NODE_OPTIONS configured: " + Boolean(process.env.NODE_OPTIONS));
          console.log("NODE_USE_ENV_PROXY configured: " + Boolean(process.env.NODE_USE_ENV_PROXY));
          console.log("Relevant environment variable names: " + (Object.keys(process.env).filter((key) => /proxy|agent|fetch|node_options/i.test(key)).sort().join(", ") || "(none)"));

          for (const [label, hostname] of [["staging", target.hostname], ["api-clue", "api"]]) {
            try {
              const records = await dns.lookup(hostname, { all: true });
              console.log("DNS " + label + ": resolved (" + records.length + " address record(s))");
            } catch (error) {
              console.log("DNS " + label + ": " + (error.code || error.name));
            }
          }

          for (const key of ["HTTPS_PROXY", "https_proxy", "HTTP_PROXY", "http_proxy", "ALL_PROXY", "all_proxy"]) {
            const value = process.env[key];
            if (!value) continue;
            try {
              const proxy = new URL(value);
              console.log("Proxy " + key + ": configured host=" + proxy.hostname + " port=" + (proxy.port || "(default)"));
              try {
                await dns.lookup(proxy.hostname);
                console.log("DNS proxy host for " + key + ": resolved");
              } catch (error) {
                console.log("DNS proxy host for " + key + ": " + (error.code || error.name));
              }
            } catch {
              console.log("Proxy " + key + ": configured but not parseable as a URL (value hidden)");
            }
          }

          try {
            const response = await fetch(target.origin, { redirect: "manual", signal: AbortSignal.timeout(5000) });
            console.log("Native fetch to staging origin: HTTP " + response.status);
            await response.body?.cancel();
          } catch (error) {
            let current = error;
            for (let depth = 0; current && depth < 3; depth += 1) {
              console.log(("Native fetch error depth " + (depth + 1) + ": " + (current.name || "Error") + " " + (current.code || "") + " " + (current.message || "")).trim());
              current = current.cause;
            }
          }
          try {
            const response = await fetch(target.origin, {
              headers: { "x-vercel-protection-bypass": process.env.VERCEL_AUTOMATION_BYPASS_SECRET || "" },
              redirect: "manual",
              cache: "no-store",
              signal: AbortSignal.timeout(5000),
            });
            console.log("Native fetch with Vercel bypass header: HTTP " + response.status);
            await response.body?.cancel();
          } catch (error) {
            let current = error;
            for (let depth = 0; current && depth < 3; depth += 1) {
              console.log(("Native fetch with bypass header error depth " + (depth + 1) + ": " + (current.name || "Error") + " " + (current.code || "") + " " + (current.message || "")).trim());
              current = current.cause;
            }
          }
          NODE
      - name: Run staging-only unauthenticated smoke checks
        env:
          AIVANTA_STAGING_URL: https://ai-automation-git-fix-staging-smoke-preview-target-veerex-org.vercel.app
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node scripts/staging-smoke.mjs
