name: Aivanta staging runtime smoke test

on:
  workflow_dispatch:
  push:
    branches:
      - ops/authorized-staging-smoke-20261015

permissions:
  contents: read

concurrency:
  group: aivanta-staging-runtime-smoke
  cancel-in-progress: false

jobs:
  staging-smoke:
    name: Protected preview endpoint contracts
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: staging
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      # Do not perform DNS lookups or HTTP requests before the smoke script has
      # validated the exact allowlisted host and the required protection secret.
      - name: Run staging-only unauthenticated smoke checks
        env:
          AIVANTA_STAGING_URL: https://ai-automation-git-fix-staging-smoke-preview-target-veerex-org.vercel.app
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node scripts/staging-smoke.mjs
