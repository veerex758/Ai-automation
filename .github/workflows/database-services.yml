name: Database service integration

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-services-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mysql-mongodb:
    name: Real MySQL and MongoDB worker adapters
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      MYSQL_TEST_URL: mysql://root:aivanta_test_password@127.0.0.1:3306/aivanta_test
      MONGODB_TEST_URL: mongodb://root:aivanta_test_password@127.0.0.1:27017/aivanta_test?authSource=admin&tls=true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Create local CA and database server certificates
        shell: bash
        run: |
          set -euo pipefail
          CERT_DIR="$RUNNER_TEMP/aivanta-db-certs"
          mkdir -p "$CERT_DIR"
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 \
            -keyout "$CERT_DIR/ca.key" -out "$CERT_DIR/ca.pem" \
            -subj "/CN=Aivanta CI Database CA"
          openssl req -newkey rsa:2048 -nodes \
            -keyout "$CERT_DIR/server.key" -out "$CERT_DIR/server.csr" \
            -subj "/CN=localhost"
          cat > "$CERT_DIR/server.ext" <<'CERT'
          subjectAltName=DNS:localhost,IP:127.0.0.1
          extendedKeyUsage=serverAuth
          CERT
