name: Aivanta demo node package

on:
  pull_request:
    paths:
      - "packages/aivanta-demo-node/**"
      - ".github/workflows/node-demo-package.yml"
  push:
    branches:
      - feat/node-installation-foundation
    paths:
      - "packages/aivanta-demo-node/**"
      - ".github/workflows/node-demo-package.yml"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate package policy
        working-directory: packages/aivanta-demo-node
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import assert from "node:assert/strict";
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const source = fs.readFileSync("dist/index.js", "utf8");
          assert.equal(pkg.name, "@aivanta/demo-hello");
          assert.equal(pkg.version, "1.0.0");
          assert.deepEqual(pkg.files, ["dist/index.js", "README.md"]);
          assert.equal(Object.hasOwn(pkg, "scripts"), false);
          assert.equal(source.includes("process.env"), false);
          assert.equal(source.includes("fetch("), false);
          assert.equal(source.includes("node:fs"), false);
          assert.equal(source.includes("eval("), false);
          const manifest = JSON.parse(fs.readFileSync("registry-manifest.template.json", "utf8"));
          assert.deepEqual(manifest.permissions, []);
          assert.equal(manifest.installPolicy, "no-scripts");
          assert.equal(manifest.nativeDependencies, false);
          assert.equal(manifest.entrypoint, "dist/index.js");
          NODE
      - name: Build immutable package and calculate SRI
        working-directory: packages/aivanta-demo-node
        run: |
          npm pack --ignore-scripts --json > pack.json
          TARBALL="$(node -e 'const p=require("./pack.json"); process.stdout.write(p[0].filename)')"
          INTEGRITY="$(node -e 'const fs=require("node:fs"); const c=require("node:crypto"); const p=process.argv[1]; process.stdout.write("sha512-"+c.createHash("sha512").update(fs.readFileSync(p)).digest("base64"))' "$TARBALL")"
          cp registry-manifest.json committed-registry-manifest.json
          node --input-type=module - "$INTEGRITY" <<'NODE'
          import fs from "node:fs";
          const integrity = process.argv[2];
          const manifest = JSON.parse(fs.readFileSync("registry-manifest.template.json", "utf8"));
          manifest.integrity = integrity;
          fs.writeFileSync("registry-manifest.json", JSON.stringify(manifest, null, 2) + "\n");
          fs.writeFileSync("artifact-integrity.txt", integrity + "\n");
          NODE
          node ../../scripts/review-node-package.mjs "$TARBALL" "$INTEGRITY" > static-review-report.json
          cat static-review-report.json >> "$GITHUB_STEP_SUMMARY"
          echo "### Aivanta demo package" >> "$GITHUB_STEP_SUMMARY"
          echo "- Package: @aivanta/demo-hello@1.0.0" >> "$GITHUB_STEP_SUMMARY"
          echo "- Artifact: $TARBALL" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA-512 SRI: $INTEGRITY" >> "$GITHUB_STEP_SUMMARY"
          cat registry-manifest.json >> "$GITHUB_STEP_SUMMARY"
          # Verify the committed immutable artifact and reviewed registry manifest.
          base64 --decode artifacts/aivanta-demo-hello-1.0.0.tgz.base64 > committed.tgz
          cmp "$TARBALL" committed.tgz
          test "$(node -e 'const m=require("./registry-manifest.json"); process.stdout.write(m.integrity)')" = "$INTEGRITY"
          cmp committed-registry-manifest.json registry-manifest.json
          mkdir -p output
          cp "$TARBALL" registry-manifest.json artifact-integrity.txt static-review-report.json output/
      - uses: actions/upload-artifact@v4
        with:
          name: aivanta-demo-hello-1.0.0-review-candidate
          path: packages/aivanta-demo-node/output/*
          if-no-files-found: error
          retention-days: 30
