name: Supabase migration replay

on:
  push:
    branches: [main, staging/aivanta-supabase-rebuild]
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-migration-replay.yml"
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-migration-replay.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-migration-replay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clean-replay:
    name: Clean local Supabase migration replay
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start isolated local Supabase
        run: supabase start

      - name: Reset local database and replay every tracked migration
        run: supabase db reset --local

      - name: Confirm local Supabase status
        run: supabase status

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
